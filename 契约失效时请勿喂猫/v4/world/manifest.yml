# ticket 78 G4（票 77 检 1 的编码）：公告栏是**文书**，不是动作目标以外的东西。
# read 的可用对象来自 documents/item-with-content，所以“去看公告栏”必须落到一块
# 登记过的板上；板上就是此刻贴着的字。三块板分房登记：剧情里的通知全贴在
# 学生会办公室门边那块（“公告栏”本身），其余两处是同一套张贴系统的本地板。
# ticket 84（复盘 S4 / 审计 P1-#4）：读完这块板，角色学到的是“这是一块板”，不是
# “板上写着什么”——三名角色先后读到它，然后都说“公告栏没有给出能用的信息”。
# 正文改成板面此刻的主张：压在最上面的是当天最新的那张通知（要办什么，读那张纸），
# 右下角常钉着一页打印的办事指引（找谁办事）。两份当天的剧情通知不写死在这行里：
# 审计通知 10:00 才贴、纪念活动通知 15:00 才贴，写死在板上等于让 07:00 的读者看见
# 还没贴出的纸；它们各自由自己的排程通知点名。
# ticket 93（裁定：文书默认是可移动的纸，板是钉住的陈设）：这三块板写
# `takeable: false` + `fixed_reason`，与 `items:` 的固定陈设同一机制——take/give/
# trash 结构化拒绝、拒绝理由用这句话，「这里能拿的」清单里不再出现它们；
# read 照旧，就地看着读板上贴着的纸。
