documents:
- id: 2013年邻里撤离通知书
  title: 2013年邻里撤离通知书
  location:
  reading_seconds: 40
  content: 一张泛黄的许可证表格，落款是[[老街坊代表]]的手写签名，页边空白处有一条铅笔画的窄窄[[洪水路线旁注]]，旁注末尾拖着一个没写完的箭头。
- id: 2013年台风台账
  title: 2013年台风台账
  location: 校史档案室
  reading_seconds: 90
  content: 纸质台账，按时间登记台风夜的呼入电话与器材借用：21:40 接到[[小学]][[地下室]]进水的电话，22:05 [[器材室]]借出[[两台抽水泵]]（经手人签名潦草），共三通呼入记录。最后一行是半句没写完的目击记录："[[地下室]]外站着一个老人，手里……"，纸面到此为止。
- id: 2013年外借记录导出件
  title: 2013年外借记录导出件
  location: 校史档案室
  reading_seconds: 55
  content: 档案室后来用机器导出的存档目录，格式整齐：呼入记录只有两通，器材借出时间印作 23:30，目击记录一行完全缺失。导出件的时间戳与纸质台账对不上。
- id: 学生会审计包
  title: 学生会审计包
  location: 学生会办公室
  reading_seconds: 70
  content: 一沓报销单据和一张汇总表：行项目齐全，但汇总表上有两个总额没有标注用途，旁边一处手写更正没有署名。可见的行项目对不上这两个总额，底层的报销凭证不在这包里。
- id: 校报草稿
  title: 校报草稿
  location: 半坡咖啡馆
  reading_seconds: 50
  content: 一份校报的打印草稿，讲一件涉及报销争议的旧闻：引用了不愿具名的信源，多处句子下画着"待核实"的铅笔线，页眉写着编辑的催稿批注。
