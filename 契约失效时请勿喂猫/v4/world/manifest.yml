schema_version: 1
world_id: banshan-campus
system:
  name: 台账
  bound_actor: 陈默
  case_id: ambiguous-obligations
  terms:
  - 说出它是什么
  - 说出责任人是谁
  - 说出期限
  reward: 一个窄口径的客观澄清
  query_limit: 1
  # ticket 93（用户裁定 2026-10-18）：**结案 ≠ 首次命中**。答对只产生 system_answer，
  # 案子照旧开着、额度照旧递减；结案由下面点名的那条排程节拍驱动（3/22 15:00 的
  # `ledger_settlement`，对应 V4-STORY-MILESTONES 的 d7「台账结算」）。
  # 名字改这里就必须同时改 `scheduled:` 里那条，world_loader 会在加载时校验。
  settle_on: ledger_settlement
  # 票 95（E95）：条目可声明 `keywords`，引擎做确定性匹配（归一化后按命中词数打分，
  # 唯一最高分即答，零分或并列答“不知道”）；条目自己的问句也算一个匹配词。
  # 这里给三条事实各补一组词，覆盖受约束角色真会说的自然问法里的主体名词——
  # 窗口 4 他按 `terms` 泛问（“责任人是谁”“期限是什么”）5 次 0 命中。
  # 约束：同一条内部可多词，但三条之间不得互相命中，否则并列 = 又一句“不知道”。
  facts:
    红色哨子在哪里？:
      answer: 老家属院的地下室
      # 物件侧（哨子 / 那只红帆布哨套）+ 答案里的两处地名。不收单独的“红色”：
      # 太宽，会把“红色的伞在哪”也吸到这里。
      keywords: [哨子, 红色哨子, 红哨套, 哨套, 老家属院, 地下室]
    2013年邻里撤离通知书的责任人是谁？:
      answer: 当年在许可证上签名的那个人
      # 文书侧（正式名 / 口头简称）+ 责任侧（`terms` 里的“责任人”、真正可查的落款“签名”）。
      keywords: [撤离通知书, 通知书, 责任人, 签名, 谁签的字]
    学生会审计核对的期限是什么？:
      answer: 学生会审计核对，2026-03-16T16:00:00+08:00
      # 原问句“当前记录的期限是什么？”里的“当前记录”在世界上没有指称物，
      # 改为点名那件事本身；问句与 `keywords` 只问“到什么时候”，不写核对结果。
      keywords: [期限, 截止, 最迟, 多久, 审计]
clock:
  start: '2026-03-16T07:00:00+08:00'
  stop: '2026-03-27T21:30:00+08:00'
