# ---- Tier-A leftovers: relations that were prose-only before ----
- id: chen-father
  name: 陈默爸
  kind: person
  known_to: [陈默, 陈默妈]
  desc: "[[陈默]]的父亲，跑长途，常年不在家。"
  memory:
    陈默: 我爸常年在外跑车，家里的事都是我妈一个人扛。
    陈默妈: 他跑长途，半个月不着家，我一个人对着一屋子安静。
- id: canteen-husband
  name: 食堂大妈的丈夫
  kind: person
  known_to: [食堂大妈]
  desc: "[[食堂大妈的丈夫]]，跑长途货车，半个月回不来一趟。"
  memory:
    食堂大妈: 他半个月不着家，回来也是倒头就睡。
- id: canteen-son
  name: 食堂大妈的儿子
  kind: person
  known_to: [食堂大妈]
  desc: "[[食堂大妈的儿子]]，前年高考失利，现在在她店里帮工。"
  memory:
    食堂大妈: 儿子在我店里帮工，娘俩一天说不上十句话。
- id: xiaolan-excolleague
  name: 唐小岚的前同事
  kind: person
  known_to: [唐小岚]
  desc: "[[唐小岚]]上一份工作里的同事——她的一句玩笑让对方当众下不来台。"
  memory:
    唐小岚: 我把听来的事当笑话讲了半句，她当着一层人的面下不来台。一周之内我就被辞退了。
- id: xiaolan-exboss
  name: 唐小岚的前老板
  kind: person
  known_to: [唐小岚]
  desc: "[[唐小岚]]上一份工作的老板，辞退她的那个人。"
  memory:
    唐小岚: 辞退我的决定是他做的。我到今天没想明白，罚的是多嘴，还是被抓住。
