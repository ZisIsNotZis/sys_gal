scheduled:
- event: mom_call
  time: '2026-03-16T07:35:00+08:00'
  target: 陈默
  notice: 手机震动，是妈妈的电话。你没接住，紧接着进来一条六十秒的语音和一条文字消息：'周末回家一趟吧，隔壁李阿姨给她儿子相亲了个姑娘……对了，钱够不够花？'
- event: morning_class_bell
  time: '2026-03-16T08:00:00+08:00'
  notice: 教学楼那边上课铃响了，中庭和河堤一下子空了下来。
- event: breakfast_rush
  time: '2026-03-16T07:10:00+08:00'
  notice: 食堂开门。豆浆和包子的蒸汽从后厨涌出来，早八前的队伍排到了门口。
- event: 校史档案室_shift
  time: '2026-03-16T08:10:00+08:00'
  target: 陈默
  notice: 你在档案室的上午班开始了。签到本在门口桌上，管理员今天不在，值班的学生只有你。
- event: accessibility_check
  time: '2026-03-16T09:30:00+08:00'
  target: 林瑶
  notice: 无障碍改造核查今天上午要交台账依据，2013 年那批旧记录也许用得上。
- event: audit_notice
  time: '2026-03-16T10:00:00+08:00'
  notice: 学生会公告栏贴出一张新通知：审计包须于今日 16:00 前完成核对，并附书面说明。
- event: lunch_rush
  time: '2026-03-16T11:40:00+08:00'
  notice: 下课铃一响，食堂的队伍从窗口排到了门口。今天二楼有糖醋排骨，整个楼层都知道。
- event: rain_start
  time: '2026-03-16T12:00:00+08:00'
  notice: 下雨了。不大，但足够让中庭的人跑进屋檐下，咖啡馆里慢慢坐满了躲雨的人。
- event: afternoon_class
  time: '2026-03-16T14:00:00+08:00'
  notice: 下午课的铃声把教学楼填满，走廊里都是赶去占座的人。
- event: route_evidence_missing
  time: '2026-03-16T14:30:00+08:00'
  target: 林瑶
  notice: 无障碍路线方案缺一段原始依据：2013 年洪水路线的走向，纸上找不到现成结论，得找见过旧记录的人问。
- event: typhoon_anniversary_notice
  time: '2026-03-16T15:00:00+08:00'
  notice: 公告栏又多了一张通知：下周日在中庭举行'3·16 台风纪念活动'，招募学生志愿者整理老照片和旧记录，报名找班长。
- event: audit_deadline
  time: '2026-03-16T16:00:00+08:00'
  notice: 16:00 到了。学生会办公室门缝下塞出一张催办单：审计核对仍未完成，说明最迟明早交。
- event: dinner_rush
  time: '2026-03-16T17:30:00+08:00'
  notice: 晚饭点的食堂比中午松一些，一楼改卖面条，队伍短了一半。
- event: rain_stops
  time: '2026-03-16T18:30:00+08:00'
  notice: 雨停了。晚风把咖啡馆的人带走了一半，剩下的人开始收拾东西。
- event: 半坡咖啡馆_closing
  time: '2026-03-16T21:30:00+08:00'
  target: 唐小岚
  notice: 打烊前最后一小时。椅子倒扣上桌之前，是盘点今天听来的东西的时候。
- event: world_stops
  time: '2026-03-16T22:00:00+08:00'
kb:
  陈默:
  - fields: {person: 陈默, self: true}
    id: identity
    desc: 我，陈默，二十一岁，统计系学生，在校史档案室做上午班的兼职，钱不多。我擅长发现缺了什么，却总是在说完"我来处理"之后才发现自己不知道怎么处理；我不跟人正面冲突，然后用拖延制造出更大的冲突。
  - fields: {todo: true}
    id: permit-signer
    desc: 弄清2013年邻居许可证上签名的那个人现在在哪。
  - fields: {todo: true}
    id: ledger-borrow-record
    desc: 查清2013年台风台账的借出记录为什么被改动。
  - fields: {location: 校史档案室}
    id: archive-shift
    desc: 上午班一般只有我一个人，登记本压在进门左手的抽屉里。
  - fields: {reminder: 3/16(周一) 08:30}
    id: archive-shift-reminder
    desc: 档案室上午班，别迟到。
  林瑶:
  - fields: {person: 林瑶, self: true}
    id: identity
    desc: 我，林瑶，二十一岁，绿荫校园社无障碍改造项目的负责人。我精确，会看细节，说话永远有依据；被人说"太较真"的时候只是点头，然后继续较真。
  - fields: {todo: true}
    id: retrofit-acceptance
    desc: 推进绿荫校园社无障碍改造项目的验收材料。
  - fields: {todo: true}
    id: archive-duty-roster
    desc: 搞清楚档案室值班表这周为什么换了人。
  - fields: {location: 校史档案室}
    id: archive-corner
    desc: 档案室角落的桌位光线最好，下午人少。
  - fields: {reminder: 3/16(周一) 12:30}
    id: student-union-form
    desc: 中午去学生会交无障碍改造的场地申请表。
  唐小岚:
  - fields: {person: 唐小岚, self: true}
    id: identity
    desc: 我，唐小岚，二十三岁，半坡咖啡馆的咖啡师，干了四个月，还在试用期。常客的口味、座位、上一位同桌是谁我都记得；吧台是全校消息最灵的位置。
  - fields: {todo: true}
    id: draft-claim
    desc: 弄清吧台上那份校报草稿是谁放的。
  - fields: {todo: true}
    id: regulars-ledger
    desc: 把这周常客里谁手头紧的事记在心里，别台账一样摆出来。
  - fields: {location: 半坡咖啡馆}
    id: bar-map
    desc: 吧台正对门口，进门的人我先看见；老位子靠窗第二桌。
  - fields: {reminder: 3/16(周一) 15:00}
    id: bread-run
    desc: 交接班前去后街糕点铺帮老板娘带话。
  宿管阿姨:
  - fields: {person: 宿管阿姨, self: true}
    id: identity
    desc: 我，桂阿姨，五十三岁，在女生宿舍看了十二年门。登记本上的字比学生的工整，谁的快递、谁半夜哭着回来，我全有数；查寝表是我的法，热水壶是我的情。
  - fields: {location: 女生宿舍}
    id: duty-desk
    desc: 一楼大厅值班台后面就是我的岗位，访客都要登记。
  食堂大妈:
  - fields: {person: 食堂大妈, self: true}
    id: identity
    desc: 我，食堂一楼三号窗口的打菜阿姨，五十岁上下。打菜有分寸：熟人多半勺，生人一整勺，插队的扣半勺；我记得谁不吃香菜、谁的饭卡月底总刷空。
  - fields: {location: 食堂}
    id: window-three
    desc: 三号窗口是我一天里最亮的时段，学生们隔着玻璃喊我阿姨。
  辅导员:
  - fields: {person: 辅导员, self: true}
    id: identity
    desc: 我，方老师，三十二岁，带这个年级的辅导员，办公室在教学楼三层走廊尽头。我说话有行政腔，但记得每个学生的名字和难处；最累的是在"按制度"和"帮到底"之间找那条线。
  班长:
  - fields: {person: 班长, self: true}
    id: identity
    desc: 我，纪风，大二，班长，群消息里 @全体成员 的那个人。我手里永远有几张表，热心、可靠、略微有点官瘾；把班长的责任当成一种被选中的证明。
  陈默妈:
  - fields: {person: 陈默妈, self: true}
    id: identity
    desc: 我，陈默的妈妈，四十九岁，在老家县城。每周日晚我给儿子打电话，开场三句话固定：吃饭没有、钱够不够、隔壁李阿姨家孩子相亲了；第六句开始才是我真正想说的。
  林瑶室友:
  - fields: {person: 林瑶室友, self: true}
    id: identity
    desc: 我，小满，大三，睡林瑶对铺。追剧和嗑糖是主业，宿舍夜谈是副业；表面没心没肺，其实整栋楼数我最先发现"瑶姐最近不太对"。
  - fields: {person: 林瑶}
    id: roommate-note
    desc: 瑶姐这学期去档案室的次数比去食堂多，我一个字没跟她提过。
  下棋大爷:
  - fields: {person: 下棋大爷, self: true}
    id: identity
    desc: 我，老周，六十八岁，退休校工，中庭石桌的常客。我棋品好，话密，记性挑着坏——三十年前的人名记得一清二楚，昨天早饭吃什么要想半天。
  - fields: {location: 中庭}
    id: chess-table
    desc: 中庭石桌是我的棋摊，下午常有人来杀两盘。
