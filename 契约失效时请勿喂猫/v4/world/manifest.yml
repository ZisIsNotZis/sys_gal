    陈默: 我的东西，从[[老街坊]]带出来的，漆面有几道划痕。后来它就不在我手上了——我一直在找它。
- id: blue-rabbit-sticker
  name: 蓝色兔子贴纸
  kind: item
  known_to: [林瑶]
  desc: 一张蓝色兔子图案的旧贴纸，[[林瑶]]抽屉里收着，来自[[家属院]]。
  memory:
    林瑶: 贴纸从[[家属院]]带出来，我留到现在。它和眼前这个[[陈默]]是同一年的事——我一直没把它们并到一起。
- id: blue-rabbit-umbrella
  name: 蓝色兔子雨伞
  kind: item
  known_to: [陈默]
  desc: 一把儿童尺寸、印着褪色蓝色兔子的雨伞，[[陈默]]当年没送出去的东西，听说混在老[[家属院地下室]]那堆旧物里。
  memory:
    陈默: 那把伞我买了没送出去，后来就不见了。听说[[地下室]]的旧物还在，我想找回来。
- id: pumps
  name: 两台抽水泵
  kind: item
  # ticket 62 收尾：与 equipment-room 同构——desc 只写身份；「纸质台账记
  # 22:05、导出件记 23:30」是读到 [[2013年台风台账]] / [[2013年外借记录导出件]]
  # 才得到的结论（ticket 49）。只留在场者（下棋大爷）与要查借出记录的两名主角；
  # 食堂大妈的公开传闻（“器材室借抽水泵帮小学”）是地点层公开记忆
  # （[[食堂]] 场景注记），不需要这条存档内部实体行。
  known_to: [陈默, 林瑶, 下棋大爷]
  desc: 2013 年台风夜从[[器材室]]借出去救水的[[两台抽水泵]]。
  memory:
    下棋大爷: 泵是那晚最要紧的东西，谁先拿到谁家就能先出水。
- id: ledger-copy
  name: 台账私人抄件
  kind: item
  known_to: [林瑶]
  desc: "[[林瑶]]自己留的一份 2013 年台账私抄；在说清它从哪来之前，公开它只会毁掉项目的信誉。"
  memory:
    林瑶: 抄件是我私下留的。我还没想好怎么说明它的来路。
- id: flood-route-note
  name: 洪水路线旁注
  kind: thing
  aliases: [洪水路线]
  # ticket 62：只有持件的 [[陈默]] 与要靠它补方案依据的 [[林瑶]] 知道它存在；
  # 「箭头没画完」这一层由看见/读到 [[2013年邻里撤离通知书]] 得到（ticket 49）。
  known_to: [陈默, 林瑶]
  desc: "[[2013年邻里撤离通知书]]页边空白处一条铅笔画的窄窄[[洪水路线]]旁注。"
  memory:
    陈默: 那条铅笔线是上一辈人手画的，箭头断在最要紧的地方。
    林瑶: 方案差的就是这一段。全校最能帮我的人，恰好是我最不想开口的那个。
- id: borrow-register
  name: 借阅登记本
  kind: item
  known_to: [陈默, 林瑶]
  desc: 档案室压在进门左手抽屉里的[[借阅登记本]]，谁借过什么、什么时候借的都记在上面。
  memory:
    陈默: 登记本就在左手抽屉。我那天正要去翻，结果被支开了。
# ---- events / history ----
- id: typhoon-2013
  name: 2013年台风夜
  kind: event
  known_to: [陈默, 林瑶, 下棋大爷]
  desc: 2013 年那场台风的夜里，校园和[[家属院]]多处进水：[[小学]][[地下室]]、[[家属院地下室]]、[[食堂后厨]]都进了水，[[操场]]是那之后翻修的。
  memory:
    陈默: 那晚我只剩下碎片。我答应过[[林瑶]]留下，然后走了，好像过了一个小时才回来——她记住的是哪个版本，我不知道。
    林瑶: 那晚他答应我留下，然后走了。我不记得他后来带回来的是哪个大人。
    下棋大爷: 那晚我在大门值班。[[家属院]]和[[小学]]都进了水，抽水泵来回跑，喊人的声音整片楼都听得见。
- id: flood-route-2013
  name: 2013年洪水路线
  kind: thing
  known_to: [陈默, 林瑶]
  desc: 2013 年那场台风的水线走向，[[家属院]]的老人按记忆走过一遍。无障碍方案的原始依据要的正是它。
  memory:
    陈默: 老路线的走向我小时候走来走去，闭着眼都记得——可纸上没有现成结论。
    林瑶: 我要的是能写进方案的依据，不是谁的记忆。
- id: childhood-promise
  name: 九岁那年的承诺
  kind: event
  known_to: [陈默, 林瑶]
  desc: 九岁那年[[陈默]]答应[[林瑶]]留下，然后走了。两个人各自记着不同的版本，谁也没先开口。
  memory:
    陈默: 我答应她留下，然后走了。我想把当年的事说开，不是背好的道歉稿，是当面一句完整的话。
    林瑶: 他说"我来"。我到现在分不清我要的是道歉，还是那句"当年你为什么要走"。
- id: heard-crying
  name: 那晚听见的哭声
  kind: event
  known_to: [陈默]
  desc: 2013 年台风夜，[[陈默]]在楼道里听见的哭声。他从没跟任何人提过。
  memory:
    陈默: 那晚我其实听见了哭声。这件事我谁也没说。
- id: xiaolan-fired
  name: 唐小岚被辞退
  kind: event
  known_to: [唐小岚]
  desc: 上一份工作里，[[唐小岚]]把无意听到的事当笑话讲了半句，一个同事当众下不来台；一周之内她被辞退。
  memory:
    唐小岚: 我到今天没想明白，被罚是因为多嘴，还是因为被抓住。这件事我绝不说出口。
- id: unpaid-coffee
  name: 没付的那杯咖啡
  kind: event
  known_to: [陈默, 唐小岚]
  desc: 上一学期，[[陈默]]在[[半坡咖啡馆]]有一杯咖啡没付钱就走了。[[唐小岚]]从没提过。
  memory:
    陈默: 那杯咖啡我一直没去补。羞耻压着，偏偏那家店我还要常去。
    唐小岚: 我没提过。这根小杠杆捏在手里，用一次是人情，用第二次就是要挟——我有点羞耻。
- id: shift-swap
  name: 值班表换人
  kind: event
  known_to: [陈默, 林瑶, 班长, 辅导员]
  desc: 这周[[校史档案室]]的值班表把[[小周]]和[[小陈]]换了下去，理由没人说得清。
  memory:
    陈默: "[[值班表换人]]换得不正常。我一直在查是为了什么。"
    林瑶: "[[班长]]说\"不只是换人那么简单\"，档案室的老人只拿\"排班调了调\"搪塞我。"
- id: anniversary-activity
  name: 3·16台风纪念活动
  kind: event
  known_to: [陈默, 林瑶, 唐小岚, 班长, 下棋大爷]
  desc: 下周日在[[中庭]]办的台风纪念活动，招募志愿者整理[[老照片]]和[[旧记录]]；今天正好是 3 月 16 日。
- id: access-project
  name: 无障碍改造项目
  kind: event
  known_to: [陈默, 林瑶, 辅导员, 班长]
  desc: "[[绿荫校园社]]的[[无障碍改造项目]]，[[林瑶]]负责，今天下午之前要交原始依据；[[中庭]]塌陷的透水砖在名单上排第一。"
  memory:
    林瑶: 这是白纸黑字的事。私底下我更想验证的，是另一个人这次会不会做到。
- id: audit-case
  name: 学生会审计
  kind: event
  known_to: [陈默, 林瑶, 辅导员, 班长]
  desc: "[[学生会办公室]]桌上摊着一份在办的审计，核对期限是今天 16:00；总表与凭证逐项对得上对不上，得当场开包核对才作数。"
  # ticket 47：谜题条目只写谜面（疑问与可见异常），答案写在读取
  # [[学生会审计包]] 才得到的 content 里。puzzle 为 lint 声明答案归属，
  # 不进入任何角色的 KB 行，模型看不到。
  puzzle:
    reveal: 学生会审计包
    answer:
      - 汇总表上有两个总额没有标注用途
      - 旁边一处手写更正没有署名
      - 底层的报销凭证不在这包里
  memory:
    林瑶: 审计包的手法，跟台账被改的手法是一个路数。
