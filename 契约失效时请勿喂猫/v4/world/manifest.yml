# ticket 96（窗口 4 §B / 票 94 §4）：305 是课表上写着的房号，也是一个真实存在的地方——
# 一天里 17 个角色说了 219 条关于 305 的话、165 条是「我没法扶/陪/带」，0 次到位，
# 16:13 辅导员的 move 还得到「教学楼三楼305 不是一个你知道的地方」。课表能回答「哪间」，
# 「到」却不在世界里：房号只是课表正文，没有门。
# 修法是把三楼真的建成地点：正门内侧的楼梯上去是走廊，走廊两侧是两间上课的教室。
# 地点身份是世界层公共常识（不写 known_to，票 61），内部细节另起一段、只在到场时
# 经客观描述下发（票 58）。
- id: 三楼走廊
  x: 2
  y: -16
  sound_radius: 10
  rules:
  - 上下课铃响时走廊里人来人往，别逆着人流走
  - 22:00 后锁楼
  extras:
  - fragment: 课间站在走廊上的同学
    rarity: common
    knowledge_notes: 今天哪几节有人上课、走廊两侧哪个门牌是哪一间；下午四点以后这一层就空了
    weight: 3
  - fragment: 刚下课出来的学生
    rarity: common
    knowledge_notes: 上一节讲到哪儿、走廊上刚过去的是谁
    weight: 2
  - fragment: 上来找办公室的新生
    rarity: rare
    knowledge_notes: 走廊尽头是[[辅导员办公室]]，那扇门常关着，敲门才有人应
