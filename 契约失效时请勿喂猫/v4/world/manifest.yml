schema_version: 1
world_id: banshan-campus
system:
  name: 台账
  bound_actor: 陈默
  case_id: ambiguous-obligations
  terms:
  - 说出它是什么
  - 说出责任人是谁
  - 说出期限
  reward: 一个窄口径的客观澄清
  query_limit: 1
  facts:
    红色哨子在哪里？: 老家属院的地下室
    2013年邻居许可证的责任人是谁？: 当年在许可证上签名的那个人
    当前记录的期限是什么？: 学生会审计核对，2026-03-16T16:00:00+08:00
clock:
  start: '2026-03-16T07:00:00+08:00'
  stop: '2026-03-16T22:00:00+08:00'
engine:
  idle_wait_seconds: 900
locations:
- id: 男生宿舍
  x: -6
  y: 0
  sound_radius: 14
  rules:
  - 23:00 后熄灯保持安静
  - 异性访客须在一楼大厅会客
  - 晚归须在门口登记
  extras:
  - fragment: 楼层值班同学
    rarity: common
    knowledge_notes: 谁几点回寝、晚归登记本放在哪、走廊尽头洗衣机的使用规矩
    weight: 3
  - fragment: 隔壁寝室的学生
    rarity: common
    knowledge_notes: 楼里最近的公开小道消息：谁熬夜、谁谈恋爱
    weight: 2
  - fragment: 查寝的宿管助理
    rarity: rare
    knowledge_notes: 查寝表与晚归名单；见过陈默最近几天的归寝时间
    weight: 1
- id: 女生宿舍
  x: -6
  y: 5
  sound_radius: 12
  rules:
  - 男生止步于一楼大厅
  - 23:00 后保持安静
  - 访客须登记并由被访人下楼接
  extras:
  - fragment: 一楼大厅自习的同学
    rarity: common
    knowledge_notes: 大厅会客规矩、宿管阿姨的作息
    weight: 3
  - fragment: 值班宿管助理
    rarity: common
    knowledge_notes: 访客登记与门禁时间
    weight: 2
  - fragment: 林瑶的隔壁寝室同学
    rarity: rare
    knowledge_notes: 见过林瑶最近常往校史档案室跑；听她提过一句'旧邻居'，没细说
    weight: 1
- id: 校史档案室
  x: 14
  y: 0
  sound_radius: 12
  rules:
  - 原件经借阅登记后方可翻阅，不得带离
  - 17:00 闭馆，晚间仅值班学生留守
  - 管理员不在时重大事项须电话报备
  extras:
  - fragment: 值班学生
    rarity: common
    knowledge_notes: 借阅登记规矩、扫描仪用法、管理员不在时的代办流程
    weight: 3
  - fragment: 来查资料的学姐
    rarity: common
    knowledge_notes: 哪个柜子放哪年的材料
    weight: 2
  - fragment: 2013年在档案室值过班的老校友
    rarity: rare
    knowledge_notes: 台风那晚档案室进过水，纸质台账是后来抢救晾干的，个别页码缺失
    weight: 1
- id: 学生会办公室
  x: 0
  y: 12
  sound_radius: 12
  rules:
  - 18:00 后无人值班
  - 审计材料不得外借，仅限在场查阅
  extras:
  - fragment: 值班干事
    rarity: common
    knowledge_notes: 公告栏张贴流程、审计催办单的公开来龙去脉
    weight: 3
  - fragment: 来交材料的社团负责人
    rarity: common
    knowledge_notes: 各社团最近的活动安排
    weight: 2
  - fragment: 学生会主席团成员
    rarity: rare
    knowledge_notes: 审计包两个总额的校内公开背景：经费来源与用途的争议
    weight: 1
