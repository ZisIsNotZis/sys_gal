scheduled:
- event: mom_call
  time: '2026-03-16T07:35:00+08:00'
  target: 陈默
  notice: 手机震动，是妈妈的电话。你没接住，紧接着进来一条六十秒的语音和一条文字消息：'周末回家一趟吧，隔壁[[李阿姨]]给她儿子相亲了个姑娘……对了，钱够不够花？'
- event: morning_class_bell
  time: '2026-03-16T08:00:00+08:00'
  notice: "[[教学楼]]那边上课铃响了，[[中庭]]和[[河堤]]一下子空了下来。"
- event: breakfast_rush
  time: '2026-03-16T07:10:00+08:00'
  notice: "[[食堂]]开门。豆浆和包子的蒸汽从[[后厨]]涌出来，早八前的队伍排到了门口。"
- event: 校史档案室_shift
  time: '2026-03-16T08:10:00+08:00'
  target: 陈默
  notice: 你在档案室的上午班开始了。签到本在门口桌上，管理员今天不在，值班的学生只有你。
- event: accessibility_check
  time: '2026-03-16T09:30:00+08:00'
  target: 林瑶
  notice: 无障碍改造核查今天上午要交台账依据，2013 年那批[[旧记录]]也许用得上。
- event: audit_notice
  time: '2026-03-16T10:00:00+08:00'
  notice: "[[学生会]]公告栏贴出一张新通知：审计包须于今日 16:00 前完成核对，并附书面说明。"
- event: lunch_rush
  time: '2026-03-16T11:40:00+08:00'
  notice: 下课铃一响，[[食堂]]的队伍从窗口排到了门口。今天二楼有糖醋排骨，整个楼层都知道。
- event: rain_start
  time: '2026-03-16T12:00:00+08:00'
  notice: 下雨了。不大，但足够让[[中庭]]的人跑进屋檐下，咖啡馆里慢慢坐满了躲雨的人。
- event: afternoon_class
  time: '2026-03-16T14:00:00+08:00'
  notice: 下午课的铃声把[[教学楼]]填满，走廊里都是赶去占座的人。
- event: route_evidence_missing
  time: '2026-03-16T14:30:00+08:00'
  target: 林瑶
  notice: 无障碍路线方案缺一段原始依据：2013 年[[洪水路线]]的走向，纸上找不到现成结论，得找见过[[旧记录]]的人问。
- event: typhoon_anniversary_notice
  time: '2026-03-16T15:00:00+08:00'
  notice: 公告栏又多了一张通知：下周日在[[中庭]]举行'3·16 台风纪念活动'，招募学生志愿者整理[[老照片]]和[[旧记录]]，报名找[[班长]]。
- event: audit_deadline
  time: '2026-03-16T16:00:00+08:00'
  notice: 16:00 到了。[[学生会办公室]]门缝下塞出一张[[催办单]]：审计核对仍未完成，说明最迟明早交。
- event: dinner_rush
  time: '2026-03-16T17:30:00+08:00'
