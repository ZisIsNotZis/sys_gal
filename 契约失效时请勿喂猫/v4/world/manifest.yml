schema_version: 1
world_id: banshan-campus
system:
  name: 台账
  bound_actor: 陈默
  case_id: ambiguous-obligations
  terms:
  - 说出它是什么
  - 说出责任人是谁
  - 说出期限
  reward: 一个窄口径的客观澄清
  query_limit: 1
  facts:
    红色哨子在哪里？: 老家属院的地下室
    2013年邻里撤离通知书的责任人是谁？: 当年在许可证上签名的那个人
    当前记录的期限是什么？: 学生会审计核对，2026-03-16T16:00:00+08:00
clock:
  start: '2026-03-16T07:00:00+08:00'
  stop: '2026-03-16T22:00:00+08:00'
engine:
  idle_wait_seconds: 900
locations:
- id: 男生宿舍
  x: -6
  y: 0
  sound_radius: 14
  rules:
  - 23:00 后熄灯保持安静
  - 异性访客须在一楼大厅会客
  - 晚归须在门口登记
  extras:
  - fragment: 楼层值班同学
    rarity: common
    knowledge_notes: 谁几点回寝、晚归登记本放在哪、走廊尽头洗衣机的使用规矩
    weight: 3
  - fragment: 隔壁寝室的学生
    rarity: common
    knowledge_notes: 楼里最近的公开小道消息：谁熬夜、谁谈恋爱
    weight: 2
  - fragment: 查寝的宿管助理
    rarity: rare
    knowledge_notes: 查寝表与晚归名单；见过[[陈默]]最近几天的归寝时间
    weight: 1
- id: 女生宿舍
  x: -6
  y: 5
  sound_radius: 12
