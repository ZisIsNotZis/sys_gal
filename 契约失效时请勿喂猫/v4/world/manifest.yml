# 保留派工——不靠删任务变绿。
# ticket 80（票 79 §8-7）：`primer: false` 只把这块地方挡在**世界前言**之外（没人开局
# 就被告知校门后街有家糕点铺），它不参与 move 的目标解析——move 只认注册地点 + 路由，
# 待办里点名的唐小岚照旧走得到（夜市↔后街糕点铺 双向 300 秒），到场的人也照旧回得来。
# 因此保持只对唐小岚开放：这家铺子是她的派工目标，不是全校共用的地图节点。
- id: 后街糕点铺
  x: 44
  y: 18
  sound_radius: 8
  known_to: [唐小岚]
  primer: false
  # ticket 84（复盘 S5 / 审计 P1-#1）：地点与路由真通了以后，关卡退到“铺子里没有
  # 可问的人”：speak 只覆盖同地点 actor，而这里既无 actor 也无 extras，唐小岚 15:00
  # 的常驻任务到场后无话可问、无话可带。修法用既有机制：地点 extras 是引擎按需
  # 邀请的在场陌生人（不是新原语、不是 actor 行），把“窗口里面的人”登记成铺里唯一
  # 的常出现者，并把要带的原话写进她的知识注记——问一句就能拿到载荷。
  rules:
  - 当天的面包卖完就关门
  extras:
  # ticket 89（窗口 2 复盘 S17）：fragment 写的是“老板娘”，引擎却随手给了它“李师傅”
  # “王学长”这样的名字，唐小岚两次到场问“老板娘在不在”都对不上人。`aliases` 声明的是
  # “被点名时优先选这一条、并以这个名字出场”——这是引擎侧 extras aliases 能力的种子侧
  # 写法，待引擎落地后生效（本轮不改 harness）。
  - fragment: 后街糕点铺的老板娘
    aliases: [老板娘]
    rarity: common
    knowledge_notes: 今天哪几炉面包出炉、熟客常捎什么话；[[半坡咖啡馆]]来的熟客我都认得，吧台上那份[[校报草稿]]的来路我也知道。有人替咖啡馆那边带话过来，我要听的只有“稿子的事我晓得了，别再往吧台上放”这一句有没有带到；谁问“要带的是什么话”，我就照这句原话对一遍，别的不多问。
    weight: 3
