# ticket 78 G3：后街糕点铺以前只是 `kind: place` 的概念，正文却派唐小岚“去…帮老板娘
# 带话”（d1-pm 12:21–19:54 问路 6 小时，move 只会回“不是一个你知道的地方”）。
