  takeable: false
  fixed_reason: 整块板钉在门边的墙上，只能就地看着读上面贴的纸。
  content: |-
    学生会办公室门边那块公共公告栏：板面一层压一层，最上面那张永远是当天最新的张贴——
    要办什么事、谁来办，读最上面那张纸。板上常贴的就那几类：场地与教室的申请表、
    审计与评优的通知、活动的招募通知；没揭干净的旧通知和一角褪色的海报留在底下。
    右下角钉着一张打印的办事指引，指的全是纸：场地与教室申请，到[[学生会办公室]]长桌的
    抽屉里取《[[场地申请表]]》，填好交回登记；审计的事以板上那张书面通知为准，期限、
    要交什么、交给谁，都写在纸上，催办单从门缝里递进来就照《[[审计催办单]]》办；
    个人情况说明照板上那张《[[个人情况说明程序]]》写的办——程序一贴出来，收件渠道
    就写在上面，自己看，板上没有别的答复；档案与旧记录的事，到[[校史档案室]]翻桌上的
    《[[2013年台风台账]]》《[[值班表]]》《[[签到本]]》，纸在桌上，不必先等谁来答。
    任何张贴先到[[学生会]]盖章，没盖章的过一夜就会被揭下去。
