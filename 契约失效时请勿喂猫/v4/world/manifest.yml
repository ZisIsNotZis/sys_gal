# unreachable_targets: ticket 66 可达性契约。有些名字角色会当成地点或联系人来用，
# 但它们既不在 locations 也不在 contacts 里（校外邻居、住户门牌、楼里的寝室）。
# 名字不能硬塞进地点表，但拒绝也不能三条路全死：内核按名字查到这里的 reason（这个
# 名字在世界里到底是什么）和 hint（剧情可执行的替代：问谁／去哪／用哪个动作），
# 拼进 text/move/knock 的拒绝文案。
unreachable_targets:
  李阿姨家:
    reason: 老家属院的住户门牌，不是一处单独可到达的地点。
    hint: 老家属院与校内之间只通电话／消息，走不过去；要办事就用 text 联系那边的人。
  李阿姨:
    reason: 老家属院的邻居，住在陈默家隔壁；学校没有登记她的号码，人也不在校内。
    hint: 要给她带话只能托人——text 你通讯录里的人替你捎一句，或先用 update_memory 把这件事记下。
  老家属院:
    reason: 与校内之间只通电话／消息，当日无法步行往返；院内那一头也不是一处能进去的地方。
    hint: 校里的人走不过去，要办事就用 text 联系那边的人；从陈默家下楼两分钟就是家属院门口，楼道口住着老街坊，能当面问人。
  305宿舍:
    reason: 具体寝室不单独建模，305 就在女生宿舍楼里。
    hint: 要进的是楼里的房间——先 move 到它所在的楼（女生宿舍）；房间不必单独进入。
  # ticket 96（窗口 4 §B）：305/302 现在是真的地点（三楼走廊两侧），票 92 那三条
  # “教室不建模”的边界声明因此改写成一句歧义提示——课表上的 302/305 指的是三楼的
  # 教室，不是女生宿舍的 305宿舍（同一个人一天里把这两串数字混过一次）。“教室”这个
  # 统称仍然不建模，但也不让它变成三条路全死的拒绝。
  302:
    reason: 课表上的 302 指的是教学楼三楼的 302教室；同一串数字另有 302 寝室的说法。
    hint: 要上课或找人，move 到教学楼三楼走廊，或直接 move 302教室。
  305:
    reason: 课表上的 305 指的是教学楼三楼的 305教室，不是女生宿舍的 305宿舍。
    hint: 要上课或找人，move 到教学楼三楼走廊，或直接 move 305教室。
  教室:
    reason: 教学楼走廊两侧的房间，不单独建模；这栋楼上 302教室、305教室 就在三楼走廊两侧。
    hint: 要上课或找人，先 move 到教学楼，再上三楼走廊——302教室与305教室都在那一层。

