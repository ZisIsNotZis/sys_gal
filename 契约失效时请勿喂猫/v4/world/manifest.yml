# ticket 110（109 §D1-2-E2）：`老家属院` 与 `陈默家` 都是 remote，而[[陈默妈]]就住在院里
# （陈默家正文：“[[老家属院]]里的两室一厅”）——她从家下楼到院门口是两分钟的事，
# 引擎却在 17:59 把她的 `move 老家属院` 拒成“没有可用的路”，20:20 的打听轮因此
# 在世界上没有任何执行可能。修法不打开校内到家属院的路（那会让红色哨子与大爷的
# 末班大巴两条事实一起失真），而是给“院门口与楼道口”这一小段单独注册成地点，
# 只与[[陈默家]]相连：晚饭后院里人就在这一段坐着，当面问人在这里可执行。
# 它同样标 remote（校内的人当日过不去），所以不进入世界前言，也不接任何校内路由。
- id: 家属院门口
  x: -26
  y: 14
  sound_radius: 10
  known_to: [陈默, 陈默妈, 下棋大爷]
  primer: false
  remote: true
  rules:
  - 校外：校内的人当日过不去，只有那趟四十分钟的大巴
