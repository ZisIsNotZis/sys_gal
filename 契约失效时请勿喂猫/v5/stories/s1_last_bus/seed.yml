story: s1-last-bus
# 22:30 的末班车。三站路，一个人把包留在了座位上。
date: 2026-03-15
start_clock: 1350

places:
  - id: outside
    name: 车外
    prose: 站台的水泥地，雨被风推着斜着落
  - id: car
    parent: outside
    name: 车厢
    prose: 灯管有一支在闪
  - id: cab
    parent: car
    name: 驾驶室
    prose: 玻璃上蒙着一层水汽
    state: {door: closed, silhouette: true}

people:
  - id: jia
    parent: car
    name: 甲
    prose: 外套半湿，坐在靠门的位置
    identity: 你二十七岁，做一份和表格打交道的差事。你不爱管别人的事，但也不愿意看着东西被人丢在那儿没人管。
    knows: [car, cab, outside, notice, bag, driver]
    believes:
      - {about: notice, says: 这辆车今天最后一趟，之后没车了}
      - {about: driver, says: 司机姓刘，跑这条线很多年了}
  - id: yi
    parent: car
    name: 乙
    prose: 四十上下，穿一件洗旧的外套
    identity: 你四十出头，今晚要去医院替人守夜。有些事你不想解释，也没打算解释。
    knows: [car, bag, pillbox, outside]
    believes:
      - {about: pillbox, says: 药是按点吃的，不能断}
      - {about: bag, says: 包里没有值钱的东西，丢了也不可惜}
  - id: driver
    parent: cab
    name: 司机
    prose: 五十来岁，一直盯着前面的雨
    identity: 你跑末班车第八年。车上发生的事你不问，但落到你手上的东西你得有个交代。
    knows: [car, cab, outside]
    believes:
      - {about: car, says: 这一趟是三站，之后回场}

objects:
  - id: notice
    parent: car
    name: 通知
    prose: 边角卷了的打印纸
    state:
      marks: [{text: "本车为末班车，终点站后不再发车。", ink: printed, style: printed}]
  - id: bag
    parent: yi
    name: 包
    prose: 拉链头磨得发亮
    state: {closed: true, portable: true}
  - id: pillbox
    parent: bag
    name: 药盒
    prose: 白色的一小盒
    state:
      marks: [{text: "每日两次，饭后。", ink: printed, style: printed}]
      portable: true

schedule:
  - {at: 1357, effect: {kind: arrive, place: car, station: 第一站}}
  - {at: 1365, effect: {kind: arrive, place: car, station: 第二站}}
  - {at: 1373, effect: {kind: arrive, place: car, station: 第三站}}
  - {at: 1373, effect: {kind: stops, place: car}}
